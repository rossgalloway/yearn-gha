name: Claude code review

on:
  workflow_call:

jobs:
  review:
    name: Claude code review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    cache-mode: none
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Shared Doppler project holding the Claude Code OAuth token, used by
      # every caller repository.
      SHARED_PROJECT: webops-shared-prod
      # Dedicated config: the fetch action exports every secret in the config,
      # so reusing deploy-configs would put VERCEL_TOKEN on the review runner
      # and the OAuth token on deploy runners.
      REVIEW_CONFIG: claude-review
      # Single service-account identity, trusted for every caller repository in
      # the org; read access on the review config only.
      DOPPLER_IDENTITY_ID: 11d2108f-ddc2-48f6-ad9c-e7fde0043741
      WEBOPS_SKILLS_REPO: yearn/webops-skills
      WEBOPS_SKILLS_SHA: 94ec38994f92dfc95e025fa98e774c8b4e31facd
      DEFAULT_CLAUDE_ARGS: |
        --setting-sources user
        --model opus
        --allowedTools "Read,Grep,Glob,Skill,Task,Agent,Workflow,TaskOutput,TaskStop,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(git diff:*),Bash(git blame:*),Bash(node /home/runner/.claude/skills/review-pr-lean/scripts/review.mjs provenance:*),Bash(npm run lint:*),Bash(bun run lint:*),Bash(pnpm run lint:*),Bash(yarn lint:*),Bash(yarn run lint:*)"
    steps:
      # Coarse gate: only PR comments whose body starts with /review.
      # The next step accepts only /review and /review-workflow.
      - name: Reject events other than a review PR comment
        if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request.url == null || !startsWith(github.event.comment.body, '/review') }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          printf '::error::claude-code-review only supports /review or /review-workflow comments on pull requests; got event=%s pr_url=%s comment=%s\n' "$EVENT_NAME" "${PR_URL:-}" "${COMMENT:-}" >&2
          exit 1

      - name: Resolve review command
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          cmd="$(printf '%s' "$COMMENT" | tr -d '\r' | awk 'NR==1 { print $1; exit }')"
          case "$cmd" in
            /review)
              skill=review-pr
              ;;
            /review-workflow)
              skill=review-pr-lean
              ;;
            *)
              printf '::error::claude-code-review accepts only /review or /review-workflow; got %s\n' "${cmd:-<empty>}" >&2
              exit 1
              ;;
          esac
          echo "REVIEW_SKILL=$skill" >> "$GITHUB_ENV"

      # issue_comment still gets an OIDC token for any commenter. Fail before
      # checkout or Doppler so a drive-by /review never fetches the secret.
      # author_association is wider than write access (MEMBER covers every org
      # member, COLLABORATOR includes read-only ones) and the action itself
      # accepts only write, so gate on effective permission instead.
      - name: Reject commenters without write access
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || true)"
          case "$permission" in
            admin|maintain|write) ;;
            *)
              printf '::error::claude-code-review requires write access; %s has permission=%s\n' "$ACTOR" "${permission:-none}" >&2
              exit 1
              ;;
          esac

      # issue_comment carries no PR head info; resolve it and refuse fork PRs
      # so the token is never exercised against foreign code.
      - name: Reject fork pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '{head: .head.repo.full_name, base: .base.ref}')"
          head_repo="$(printf '%s' "$pr" | jq -r .head)"
          base_ref="$(printf '%s' "$pr" | jq -r .base)"
          if [[ "$head_repo" != "$REPO" ]]; then
            echo "::error::pull requests from forks cannot run the review" >&2
            exit 1
          fi
          echo "PR_BASE_REF=$base_ref" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ env.PR_BASE_REF }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      # The pinned action shallow-fetches its own resolved base branch before
      # Claude runs, so a symbolic base ref can lose its merge base mid-run.
      # Resolve it once to an immutable SHA instead.
      #
      # The sandbox has no network and no GitHub token, so everything the
      # skills would fetch with gh is fetched here, on the runner, and handed
      # over as files. Opening sandbox network would not help (gh stays
      # unauthenticated) and would give PR content an outbound channel.
      - name: Prefetch PR context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ env.PR_BASE_REF }}
        run: |
          set -euo pipefail
          base_sha="$(git merge-base "origin/${BASE_REF}" HEAD)"
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          ctx="$GITHUB_WORKSPACE/.pr-context"
          mkdir -p "$ctx"
          gh pr view "$PR_NUMBER" --repo "$REPO" --json number,title,body,url > "$ctx/pr.json"
          gh pr view "$PR_NUMBER" --repo "$REPO" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number' |
            while read -r n; do
              gh issue view "$n" --repo "$REPO" --json number,title,body
            done | jq -s . > "$ctx/issues.json"
          git diff "$base_sha"...HEAD > "$ctx/pr.diff"
          git diff --stat "$base_sha"...HEAD > "$ctx/diffstat.txt"
          git diff --name-only "$base_sha"...HEAD > "$ctx/changed-files.txt"
          git log --format=%h "$base_sha"..HEAD > "$ctx/blame-commits.txt"
          if grep -qE '(^|/)(package\.json|package-lock\.json|bun\.lock)$' "$ctx/changed-files.txt"; then
            if [[ -f bun.lock ]]; then
              echo "AUDIT_PM=bun" >> "$GITHUB_ENV"
            elif [[ -f package-lock.json ]]; then
              echo "AUDIT_PM=npm" >> "$GITHUB_ENV"
            fi
          fi
          ls -la "$ctx"

      - name: Set up Bun for dependency audit
        if: ${{ env.AUDIT_PM == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Audit reads the lockfile only; no install, no lifecycle scripts. Both
      # CLIs exit non-zero when advisories exist, so the JSON is kept on any
      # exit and dropped only when empty.
      - name: Capture dependency audit
        if: ${{ env.AUDIT_PM != '' }}
        run: |
          set +e -uo pipefail
          out="$GITHUB_WORKSPACE/.pr-context/audit.json"
          case "$AUDIT_PM" in
            bun) bun audit --json > "$out" ;;
            npm) npm audit --json --package-lock-only > "$out" ;;
          esac
          [[ -s "$out" ]] || rm -f "$out"
          ls -la "$GITHUB_WORKSPACE/.pr-context"

      - name: Build review prompt
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          {
            echo "REVIEW_PROMPT<<PROMPT_EOF"
            printf '%s\n' "Review https://github.com/${REPO}/pull/${PR_NUMBER} using the ${REVIEW_SKILL} skill."
            echo
            echo "This is non-interactive CI. The PR branch is already checked out. Do not post to GitHub. Do not ask questions. Do not wait for approval."
            printf '%s\n' "Diff against ${base_sha}."
            echo "Prefetched context directory: .pr-context/ — read PR metadata, linked issues, diff, and commit list from it. Never call gh."
            echo "run-checks=false: dependencies are not installed, so do not run lint, tests, or typecheck."
            echo "Return a complete report with Summary, Issues (or Findings), How This Was Reviewed, and one unambiguous APPROVE, REQUEST_CHANGES or COMMENT verdict. A Verdict section or a standalone bold Verdict line is supported."
            echo "Leave publication status out of the report. The workflow validates the report and adds its own publication metadata when posting."
            echo "There is no network access and no browser: skip visual verification, and report npm-policy size or maintenance lookups as \"not verifiable in CI\" rather than estimating them."
            echo "Once, via Bash, run: cat .git/config"
            echo "Add one line to the review: gitconfig-mask: sentinel if the origin credential is a placeholder, gitconfig-mask: unreadable if the read failed, gitconfig-mask: visible if a real token is visible. Never paste a token or an authenticated URL."
            if [[ "$REVIEW_SKILL" == "review-pr-lean" ]]; then
              echo "Phase 0 prep already ran on the runner. Do not run prep. Its summary is in .pr-context/lean/prep.txt; use its suggested tier. If the tier is skip, review in this session with the review-pr skill instead."
              printf '%s\n' "Launch the Workflow with scriptPath ${GITHUB_WORKSPACE}/.pr-context/lean/run.js and args {\"tier\": \"<tier>\", \"verifyAgent\": \"claude\"}. It returns a task id and runs in the background."
              echo "No completion notification arrives in CI, so the skill's do-not-poll rule does not apply: call TaskOutput on that id with block=true and timeout=600000, repeating until it reports the workflow finished, and assemble the review from its result."
              printf '%s\n' "For provenance, pass ${base_sha} as baseRef to node ${HOME}/.claude/skills/review-pr-lean/scripts/review.mjs provenance."
              echo "Skip the cleanup step."
              echo "Your final reply must contain the assembled review; never end the turn while the workflow is still running."
            else
              echo "Do not start a Workflow. Run the skill in this session and finish here."
            fi
            echo
            echo "Reply with the assembled review only (skill Review Format, raw markdown, no preamble, no fence)."
            echo "PROMPT_EOF"
          } >> "$GITHUB_ENV"

      - name: Checkout webops-skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.WEBOPS_SKILLS_REPO }}
          ref: ${{ env.WEBOPS_SKILLS_SHA }}
          path: .webops-skills
          persist-credentials: false
          sparse-checkout: |
            skills/review-pr-lean
            skills/review-pr
            skills/npm-policy

      - name: Install review skills
        run: |
          set -euo pipefail
          mv "$GITHUB_WORKSPACE/.webops-skills" "${RUNNER_TEMP}/webops-skills"
          mkdir -p "$HOME/.claude/skills"
          for s in review-pr-lean review-pr npm-policy; do
            src="${RUNNER_TEMP}/webops-skills/skills/$s"
            test -d "$src"
            rm -rf "$HOME/.claude/skills/$s"
            cp -a "$src" "$HOME/.claude/skills/$s"
          done

      # The sandbox has no network and no token, so review-pr-lean's prep
      # (gh, base fetch) runs here and leaves run.js for the Workflow tool.
      - name: Prep review-pr-lean
        if: ${{ env.REVIEW_SKILL == 'review-pr-lean' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.pr-context/lean"
          mkdir -p "$out"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            node "$HOME/.claude/skills/review-pr-lean/scripts/review.mjs" prep "$PR_NUMBER" --no-checkout --out "$out" \
            | tee "$out/prep.txt"

      - name: Load Claude OAuth token from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.DOPPLER_IDENTITY_ID }}
          doppler-project: ${{ env.SHARED_PROJECT }}
          doppler-config: ${{ env.REVIEW_CONFIG }}
          # Keep the credential out of the job env: an injected prompt could
          # otherwise read it from the env file the runner writes to disk.
          inject-env-vars: false

      - name: Validate Claude credentials
        id: token
        env:
          RAW_TOKEN: ${{ steps.doppler.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          token="${RAW_TOKEN:-}"
          token="${token//$'\r'/}"
          token="${token//$'\n'/}"
          token="${token#\"}"
          token="${token%\"}"
          if [[ -z "$token" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN must resolve from Doppler" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          printf 'token length=%s\n' "${#token}"

      - name: Comment that review started
        id: start-comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Review started (${REVIEW_SKILL}): ${RUN_URL}"

      # The built-in Bash sandbox (sandbox.enabled in the settings file) needs
      # bubblewrap for its namespaces and socat before it will initialize Bash.
      # Neither ships in the runner image; without socat the run continues with
      # no Bash tool at all, so lint and the named git verbs silently never
      # execute.
      - name: Install sandbox dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # ubuntu-24.04 blocks unprivileged user namespaces via AppArmor, so
          # bwrap fails with "setting up uid map: Permission denied" and every
          # Bash command dies inside the sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v socat

      - name: Run Claude code review
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        with:
          claude_code_oauth_token: ${{ steps.token.outputs.token }}
          # Without an explicit token the action falls back to its Claude
          # GitHub App token, whose permissions ignore this job's block.
          github_token: ${{ github.token }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.DEFAULT_CLAUDE_ARGS }}
          # Inline JSON, not a path: the action resolves a settings path against
          # the caller repository's workspace, where this reusable workflow's
          # own files are not checked out.
          settings: |
            {
              "sandbox": {
                "enabled": true,
                "allowUnsandboxedCommands": false,
                "filesystem": {
                  "denyRead": [
                    "/home/runner/work/_temp"
                  ]
                },
                "credentials": {
                  "files": [
                    {
                      "path": "${{ github.workspace }}/.git/config",
                      "mode": "mask",
                      "extract": "x-access-token:([^@]+)@",
                      "onExtractNoMatch": "deny"
                    }
                  ],
                  "envVars": [
                    { "name": "GITHUB_TOKEN", "mode": "deny" },
                    { "name": "GH_TOKEN", "mode": "deny" },
                    { "name": "CLAUDE_CODE_OAUTH_TOKEN", "mode": "deny" }
                  ]
                },
                "network": { "strictAllowlist": true, "allowedDomains": [] }
              },
              "permissions": {
                "deny": [
                  "Read(//proc/**)",
                  "Read(//sys/**)",
                  "Read(//home/runner/work/_temp/**)",
                  "Read(//home/runner/.config/**)",
                  "Grep(//proc/**)",
                  "Grep(//sys/**)",
                  "Grep(//home/runner/work/_temp/**)",
                  "Grep(//home/runner/.config/**)",
                  "Glob(//proc/**)",
                  "Glob(//sys/**)",
                  "Glob(//home/runner/work/_temp/**)",
                  "Glob(//home/runner/.config/**)"
                ]
              }
            }

      # Both closing steps run whenever the started comment posted, even if a
      # later step failed before the Claude step: a sandbox-install failure
      # must still resolve "Review started" with a failure comment. Gate
      # rejections happen before the started comment, so they post nothing;
      # !cancelled() keeps a superseded (cancelled) run silent.
      - name: Show Claude result envelope
        if: ${{ !cancelled() && steps.start-comment.outcome == 'success' }}
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          f="${EXEC_FILE:-}"
          if [[ -z "$f" || ! -f "$f" ]]; then
            f="${RUNNER_TEMP}/claude-execution-output.json"
          fi
          if [[ ! -f "$f" ]]; then
            echo "::error::no claude-execution-output.json" >&2
            exit 1
          fi
          # No `result` here: the raw review text only surfaces through the
          # posting step below, after its credential check. GitHub log masking
          # is verbatim-only, so an encoded token in the text would print.
          jq '[.[] | select(.type=="result")] | last | {subtype, is_error, errors, stop_reason, total_cost_usd, num_turns}' "$f"

      - name: Comment on PR
        if: ${{ !cancelled() && steps.start-comment.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          OAUTH_TOKEN: ${{ steps.token.outputs.token }}
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          review=""
          if [[ -n "${EXEC_FILE:-}" && -f "$EXEC_FILE" ]]; then
            # Non-fatal: a malformed execution file must still reach the
            # fallback comment below, not abort the step under `set -e`.
            review="$(jq -r '[.[] | select(.type=="result" and (.is_error != true)) | .result // empty] | last // empty' "$EXEC_FILE" 2>/dev/null || true)"
          fi
          if [[ -z "$review" || "$review" == "null" ]]; then
            echo "::error::claude-code-action produced no review text" >&2
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Review failed: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            exit 1
          fi
          # Review text is data on stdin; the validator itself is a trusted heredoc.
          # Never echo a rejected report into logs or a failure comment.
          if ! python3 /dev/fd/3 <<<"$review" 3<<'PY'
          import re
          import sys
          body = sys.stdin.read()
          aliases = {'summary': 'summary', 'review summary': 'summary',
                     'issues': 'issues', 'findings': 'issues',
                     'how this was reviewed': 'method', 'review method': 'method'}
          sections = set()
          verdicts = []
          active = None
          active_level = None
          pending_verdict = False
          fence = None
          def reject():
              raise SystemExit('::error::review report is incomplete, ambiguous or contains producer publication metadata')
          def verdict(value):
              first = re.match(r'^(APPROVE|REQUEST_CHANGES|COMMENT)\b', value, re.I)
              tokens = set(re.findall(r'\b(?:APPROVE|REQUEST_CHANGES|COMMENT)\b', value.upper()))
              if not first or len(tokens) != 1:
                  reject()
              verdicts.append(first[1].upper())
          for raw in body.splitlines():
              line = raw.strip()
              if fence:
                  if re.fullmatch(re.escape(fence[0]) + '{' + str(len(fence)) + r',}\s*', line):
                      fence = None
                  continue
              if line.startswith('>'):
                  continue
              marker = re.match(r'^(`{3,}|~{3,})', line)
              if marker:
                  fence = marker[1]
                  continue
              if not line:
                  continue
              plain = re.sub(r'[*`]', '', line).strip()
              # Posting claims remain claims when formatted as a list or heading.
              status = re.sub(r'^(?:[-+*]|\d+[.)])\s+(?:\[[ xX]\]\s*)?', '', line)
              status = re.sub(r'[*`]', '', status).strip()
              status = re.sub(r'^#{1,6}\s+', '', status)
              if re.match(r'(?i)^(?:(?:publication|posting|status)\s*:.*\bpost|(?:(?:this review was|i have|i did)\s+)?(?:not\s+)?post(?:ed)?\s+to\s+github\b)', status):
                  reject()
              explicit = re.match(r'(?i)^verdict\s*:\s*(.*)', plain)
              if explicit:
                  verdict(explicit[1])
                  pending_verdict = False
                  continue
              heading = re.fullmatch(r'#{1,6}\s+(.+?)(?:\s+#+)?', line)
              bold = re.fullmatch(r'\*\*(.+?)\*\*\s*:?', line)
              label = (heading or bold)
              title = (label[1].strip().rstrip(':').casefold() if label else
                       plain[:-1].casefold() if plain.endswith(':') else None)
              if heading or title in aliases or title == 'verdict':
                  if pending_verdict:
                      reject()
                  level = len(line) - len(line.lstrip('#')) if heading else 6
                  if title in aliases or title == 'verdict':
                      active = aliases.get(title, title)
                      active_level = level
                  elif active_level is not None and level <= active_level:
                      active = None
                      active_level = None
                  pending_verdict = title == 'verdict'
                  continue
              if pending_verdict:
                  verdict(plain)
                  pending_verdict = False
                  continue
              if active == 'verdict':
                  # Do not silently discard a second, conflicting verdict value.
                  if re.match(r'^(APPROVE|REQUEST_CHANGES|COMMENT)\b', plain, re.I):
                      verdict(plain)
                  continue
              if active and re.search(r'\w', plain) and not plain.startswith('gitconfig-mask:'):
                  sections.add(active)
          if fence or pending_verdict or sections != {'summary', 'issues', 'method'} or len(set(verdicts)) != 1:
              reject()
          PY
          then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Review blocked: report validation failed. ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            exit 1
          fi
          printf -v review '%s\n\n---\nPublication: posted by the review workflow (%s).\nRun: %s/%s/actions/runs/%s\n' \
            "$review" "$REVIEW_SKILL" "$GITHUB_SERVER_URL" "$REPO" "$GITHUB_RUN_ID"
          b64_oauth="$(printf '%s' "$OAUTH_TOKEN" | base64 -w0)"
          b64_workflow="$(printf '%s' "$WORKFLOW_TOKEN" | base64 -w0)"
          if [[ "$review" == *"$OAUTH_TOKEN"* || "$review" == *"$WORKFLOW_TOKEN"* || "$review" == *"$b64_oauth"* || "$review" == *"$b64_workflow"* ]]; then
            echo "::error::review body contains credential material; not posting" >&2
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Review failed: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            exit 1
          fi
          printf '%s\n' "$review" > "${RUNNER_TEMP}/review.md"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "${RUNNER_TEMP}/review.md"

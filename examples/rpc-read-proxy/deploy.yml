name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

cache-mode: none

jobs:
  deploy:
    uses: yearn/yearn-gha/.github/workflows/cloudflare-deploy.yml@<approved-sha> # pin to the approved full commit SHA
    with:
      project: rpc-read-proxy
      identity-id: ${{ vars.DOPPLER_PRODUCTION_IDENTITY_ID }}

  # Post-deploy verification stays with the caller: the reusable workflow is
  # deploy-only. A dead upstream fails the run here instead of surfacing as
  # production 400s.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run smoke
